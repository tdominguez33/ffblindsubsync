<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ffblindsubsync</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main>
    <header>
      <h1>ffblindsubsync <span class="hint" id="env-subtitle"></span></h1>
      <span class="badge" id="env-badge" hidden></span>
    </header>

    <div class="card" id="runtime-card">
      <div class="runtime-bar">
        <div class="runtime-info">
          <span class="dot" id="runtime-dot"></span>
          <span id="status">Initializing…</span>
        </div>
        <div class="actions">
          <button type="button" class="secondary" id="runtime-action-btn" hidden></button>
        </div>
      </div>
      <div class="progress" id="runtime-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="progress-track">
          <div class="progress-fill" id="runtime-fill"></div>
        </div>
        <span class="progress-pct" id="runtime-pct"></span>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <div class="field-label">
          <span>Reference video / audio / subtitle</span>
          <span class="hint">Drag &amp; drop or browse</span>
        </div>
        <div class="path-row">
          <div class="drop-zone" id="drop-ref">
            <input type="text" id="ref-path" placeholder="Movie, audio, or reference subtitle" />
            <input type="file" id="ref-file" hidden />
          </div>
          <button type="button" class="secondary" id="browse-ref">Browse…</button>
        </div>
        <div id="stream-wrap" class="sub-field" hidden>
          <div class="field-label">
            <span>Track / Stream</span>
            <span class="hint" id="stream-hint">Auto</span>
          </div>
          <select id="ref-stream">
            <option value="">Auto (recommended)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <div class="field-label">
          <span>Subtitles to sync</span>
          <span class="hint">.srt / .ass / .ssa / .sub / .vtt</span>
        </div>
        <div class="path-row">
          <div class="drop-zone" id="drop-in">
            <input type="text" id="in-path" placeholder="Subtitles file to sync" />
            <input type="file" id="input-file" hidden />
          </div>
          <button type="button" class="secondary" id="browse-in">Browse…</button>
        </div>
      </div>

      <div class="field" id="out-field" hidden>
        <div class="field-label">
          <span>Output file</span>
          <span class="hint">Auto-filled next to input</span>
        </div>
        <div class="path-row">
          <input type="text" id="out-path" placeholder="C:\path\to\subtitles.synced.srt" />
          <button type="button" class="secondary" id="browse-out">Save as…</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid-2 field">
        <div>
          <div class="field-label"><span>Reference Mode</span></div>
          <select id="vad-mode">
            <option value="subs_then_webrtc:48000" selected>Embedded Subs → 48 KHz Audio VAD</option>
            <option value="subs_then_webrtc:16000">Embedded Subs → 16 KHz Audio VAD (faster)</option>
            <option value="webrtc:48000">48 KHz Audio VAD</option>
            <option value="webrtc:32000">32 KHz Audio VAD</option>
            <option value="webrtc:16000">16 KHz Audio VAD (faster)</option>
          </select>
        </div>
        <div>
          <div class="field-label"><span>Mid-file breaks</span></div>
          <select id="split-mode">
            <option value="auto" selected>Auto-detect (safe, recommended)</option>
            <option value="off">Off (single global offset)</option>
            <option value="force">Aggressive (--split-penalty)</option>
          </select>
        </div>
      </div>

      <div class="options">
        <label><input type="checkbox" id="no-fix-framerate" /> Don't fix framerate</label>
        <label><input type="checkbox" id="gss" /> Golden-section search</label>
      </div>
    </div>

    <button type="button" class="primary" id="sync-btn" disabled>Sync subtitles</button>
    <div class="progress" id="sync-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden>
      <div class="progress-track">
        <div class="progress-fill" id="sync-fill"></div>
      </div>
      <span class="progress-pct" id="sync-pct"></span>
    </div>

    <div class="card" id="result" hidden>
      <div class="result-row">
        <div class="result-body">
          <div class="mono" id="result-summary"><span id="offset"></span></div>
          <div class="hint" id="result-meta"></div>
        </div>
        <div class="actions">
          <button type="button" class="secondary" id="result-action-btn" hidden>Open folder</button>
          <a class="btn secondary" id="download" href="#" hidden>Download synced subtitles</a>
        </div>
      </div>
    </div>

    <footer id="app-footer" hidden></footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>

</html>
